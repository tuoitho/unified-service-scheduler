services:
  postgres:
    image: postgres:16-alpine
    container_name: keyloop-scheduler-db
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyloop-scheduler-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/scheduler
      DB_USER: scheduler
      DB_PASSWORD: scheduler
      DB_POOL_SIZE: 20
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 25s
      retries: 6

volumes:
  postgres_data:
